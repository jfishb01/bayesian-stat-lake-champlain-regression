[project]
name = "stat6300a-portfolio-2"
version = "1.0.0"
description = "STAT6300A portfolio 2"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Josh Fishbein", email = "joshua.fishbein@uvm.edu"},
]
dependencies = [
    "black",
    "pandas",
    "matplotlib",
    "numpy",
    "cmdstanpy",
    "urllib3",
    "requests",
    "markdown-convert",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
